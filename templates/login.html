<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PropertyAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <div class="page">

        <!-- Subtle property background -->
        <div class="property-lines"></div>
        <div class="building building-left"></div>
        <div class="building building-right"></div>

        <!-- Login Card -->
        <div class="login-card">

            <h1>Welcome Back</h1>

            <div class="accent-line"></div>

            <form action="/login" method="POST">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">Email Address</label>

                    <div class="input-wrapper">

                        <svg class="input-icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8">
                            <rect x="3" y="5" width="18" height="14"
                                  rx="2"></rect>
                            <path d="m3 7 9 6 9-6"></path>
                        </svg>

                        <input
                            type="text"
                            id="email"
                            name="username"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-wrapper">

                        <svg class="input-icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8">

                            <rect x="4" y="10" width="16" height="11"
                                  rx="2"></rect>

                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                        </svg>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <!-- Eye -->
                        <button
                            type="button"
                            class="eye-button"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >

                            <svg id="eyeIcon"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8">

                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Login -->
                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

    </div>


    <script>

        function togglePassword() {

            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.innerHTML = `
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.1A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.5 17.5 0 0 1-3.1 3.8"></path>
                    <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 3-.5"></path>
                `;

            } else {

                password.type = "password";

                eyeIcon.innerHTML = `
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="2.5"></circle>
                `;
            }
        }

    </script>

</body>
</html>
